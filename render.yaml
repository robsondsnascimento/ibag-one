services:
  - type: web
    runtime: node
    name: ibag-one-api
    region: virginia
    plan: starter
    rootDir: backend/api
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    disk:
      name: ibag-one-study-files
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_SWAGGER
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ibag-one-postgres
          property: connectionString
      - key: STUDY_UPLOADS_DIR
        value: /var/data/studies
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: ibag-one-postgres
    databaseName: ibag_one
    user: ibag_one
    region: virginia
    plan: basic-256mb
    ipAllowList: []
